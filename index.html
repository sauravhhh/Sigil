<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sigil</title>
<meta name="description" content="Create your animated signature. Pick a style, preview it live, download as PNG or video.">
<meta name="theme-color" content="#111111">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --text:#141414; --muted:#6b7280;
    --border:#e5e7eb; --accent:#111111; --btn:#111111; --btn-text:#ffffff;
    --danger:#dc2626; --radius:16px; --shadow:0 1px 3px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1115; --card:#171a21; --text:#f3f4f6; --muted:#9ca3af;
      --border:#262b36; --accent:#f3f4f6; --btn:#f3f4f6; --btn-text:#111111;
      --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; flex-direction:column; align-items:center; transition:background .2s,color .2s;
  }
  .wrap{width:100%; max-width:640px; padding:20px 16px 40px;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand img{width:38px; height:38px; border-radius:10px;}
  .brand h1{font-size:22px; margin:0; font-weight:800; letter-spacing:-.4px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px; box-shadow:var(--shadow); margin-bottom:16px;
  }
  .card h2{font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:0 0 12px;}
  label{display:block; font-size:14px; font-weight:600; margin-bottom:8px;}
  input[type=text]{
    width:100%; padding:13px 14px; font-size:17px; border:1px solid var(--border);
    border-radius:12px; background:var(--bg); color:var(--text); outline:none;
  }
  input:focus{border-color:var(--accent);}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1px solid var(--border); background:var(--bg); color:var(--text);
    border-radius:12px; padding:8px 14px 7px; cursor:pointer; min-height:52px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  }
  .chip-prev{font-size:22px; line-height:1.3; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chip.active{border-color:var(--accent); border-width:2px; padding:7px 13px 6px;}
  .swatches{display:flex; gap:10px; flex-wrap:wrap; margin-top:4px;}
  .sw{
    width:40px; height:40px; border-radius:50%; cursor:pointer;
    border:2px solid var(--border); padding:0;
  }
  .sw.active{border-color:var(--accent); border-width:3px; transform:scale(1.08);}
  .seg{display:flex; gap:8px;}
  .seg button{
    flex:1; border:1px solid var(--border); background:var(--bg); color:var(--text);
    border-radius:12px; padding:11px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .seg button.active{background:var(--accent); color:var(--btn-text); border-color:var(--accent);}
  .opt-label{font-size:13px; font-weight:600; color:var(--muted); margin:14px 0 8px; text-transform:uppercase; letter-spacing:.6px;}
  .opt-label:first-child{margin-top:0;}
  #stage{
    width:100%; border-radius:12px; border:1px solid var(--border); display:block;
    touch-action:none; background:#fff;
  }
  #stageWrap.checker #stage{
    background-image:linear-gradient(45deg,#d4d4d4 25%,transparent 25%),linear-gradient(-45deg,#d4d4d4 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d4d4d4 75%),linear-gradient(-45deg,transparent 75%,#d4d4d4 75%);
    background-size:24px 24px; background-position:0 0,0 12px,12px -12px,-12px 0;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--btn); color:var(--btn-text); border:none; border-radius:12px;
    padding:13px 20px; font-size:16px; font-weight:600; cursor:pointer; min-height:48px;
  }
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.5; cursor:default;}
  .btn-ghost{background:transparent; color:var(--text); border:1px solid var(--border);}
  .btn-small{padding:9px 14px; font-size:14px; min-height:40px; border-radius:10px;}
  .row{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
  .row .btn{flex:1; white-space:nowrap;}
  .hint{font-size:13px; color:var(--muted); margin-top:10px; text-align:center; min-height:18px;}
  #gallery{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:12px;}
  .g-item{border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--bg);}
  .g-item img{width:100%; display:block; aspect-ratio:2/1; object-fit:cover; background:#fff;}
  .g-item .g-body{padding:8px 10px;}
  .g-item .g-name{font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .g-item .g-date{font-size:11px; color:var(--muted); margin:2px 0 8px;}
  .g-item .g-actions{display:flex; gap:6px;}
  .g-item .g-actions button{flex:1; font-size:12px; padding:7px 0; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer;}
  .g-item .g-actions button.del{color:var(--danger);}
  .empty{color:var(--muted); font-size:14px; text-align:center; padding:18px 0 6px; grid-column:1/-1;}
  footer{text-align:center; color:var(--muted); font-size:13px; margin-top:8px;}
  .spinner{width:18px; height:18px; border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:none;}
  @media (prefers-color-scheme: dark){
    .spinner{border-top-color:#111; border-color:rgba(0,0,0,.2);}
  }
  .btn.loading .spinner{display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="icon-192.png" alt="Sigil icon">
      <h1>Sigil</h1>
    </div>
  </header>

  <div class="card">
    <h2>Your name</h2>
    <input type="text" id="nameInput" placeholder="Type your name…" autocomplete="off" maxlength="40">
  </div>

  <div class="card">
    <h2>Style</h2>
    <div class="opt-label">Signature style</div>
    <div class="chips" id="styleChips"></div>
    <div class="opt-label">Ink colour</div>
    <div class="swatches" id="inkSwatches"></div>
    <div class="opt-label">Background</div>
    <div class="seg" id="bgSeg"></div>
  </div>

  <div class="card">
    <h2>Live preview</h2>
    <div id="stageWrap"><canvas id="stage" width="1200" height="600"></canvas></div>
    <div class="row">
      <button class="btn btn-ghost" id="replayBtn">↻ Replay</button>
    </div>
    <div class="row">
      <button class="btn" id="pngBtn"><span class="spinner"></span><span class="btn-label">Download PNG</span></button>
      <button class="btn" id="vidBtn"><span class="spinner"></span><span class="btn-label">Download video</span></button>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="card">
    <h2>My autographs</h2>
    <div id="gallery"></div>
  </div>

  <footer>Made with ❤️ by sauravhhh</footer>
</div>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
